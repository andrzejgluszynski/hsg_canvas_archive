[project]
name = "canvas-archive"
version = "0.2.0"
description = "Archive everything from your Canvas LMS account before you lose access"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
# Deliberately minimal: every dependency lands in the shipped binary. The CLI uses
# stdlib argparse and getpass rather than typer/questionary for exactly this reason.
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
]

[project.scripts]
canvas-archive = "canvas_archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/canvas_archive"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]
build = ["pyinstaller>=6.10"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM105", "SIM108"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
