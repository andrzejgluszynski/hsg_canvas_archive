name: Secret scan

on: [push, pull_request]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Look for Canvas tokens
        run: |
          if grep -rnEI '\b[0-9]{3,6}~[A-Za-z0-9]{30,}\b' \
               --exclude-dir=.git . | grep -v 'EXAMPLEtokenNOTreal'; then
            echo "::error::A Canvas-token-shaped string is committed"
            exit 1
          fi
          echo "No tokens found."
